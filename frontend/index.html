    *{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 400px at 75% -10%,#17253a 0,transparent 65%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1440px;margin:auto;padding:0 28px}.top{height:76px;border-bottom:1px solid #1c293b;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#0b1220eb;backdrop-filter:blur(16px);z-index:10}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:17px;letter-spacing:.02em}.logo{width:35px;height:35px;display:grid;place-items:center;color:#08111d;background:#5ee9a5;border-radius:11px;font-weight:900}.tabs{display:flex;gap:5px;padding:4px;background:#101a29;border:1px solid #223047;border-radius:12px}.tab{background:transparent;border:0;color:#9aabc1;padding:9px 14px;border-radius:8px}.tab.active{background:#243248;color:white}.right{display:flex;gap:12px;align-items:center;color:#97a8be}.dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:7px;box-shadow:0 0 10px #4ade8070}.view{padding:32px 0 60px}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin:0 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:#67dfaa;font-size:10px;font-weight:800}.heading h1{font-size:27px;line-height:1.2;margin:7px 0 5px;letter-spacing:-.03em}.sub{color:var(--muted)}.btn{border:1px solid #2a3a52;background:#172438;color:#eaf2fc;border-radius:9px;padding:10px 14px;transition:.15s}.btn:hover{border-color:#55dca0;background:#1a3040}.btn.primary{background:#53dfa1;border-color:#53dfa1;color:#07140f;font-weight:800}.btn.danger{border-color:#713446;color:#ffabb6;background:#321e2b}.btn.small{padding:6px 9px;font-size:12px}.grid{display:grid;gap:16px}.columns{grid-template-columns:minmax(0,1.45fr) minmax(320px,.72fr)}.panel{background:linear-gradient(150deg,#111c2e,#0f1928);border:1px solid var(--line);border-radius:14px;padding:20px}.panel h2{font-size:15px;margin:0 0 4px}.panelhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.muted{color:var(--muted);font-size:12px}.mapwrap{overflow:auto;padding:12px;background:#0b1421;border:1px solid #1c2b40;border-radius:11px}.lot{display:grid;gap:7px;min-width:440px}.cell{height:48px;border:1px solid #35445a;border-radius:8px;background:#182436;position:relative;display:grid;place-items:center;font-size:11px;font-weight:700;color:#bfccdc;transition:.15s}.cell.slot{cursor:pointer}.cell.slot:hover{transform:translateY(-2px);border-color:#69e2a9}.cell.available{background:#12352e;border-color:#286d54;color:#76efb4}.cell.hold{background:#3e331b;border-color:#876f33;color:#ffdb78}.cell.booked{background:#183354;border-color:#3b70a6;color:#91c7ff}.cell.occupied{background:#452b21;border-color:#9a6333;color:#ffc48a}.cell.overstay,.cell.disputed{background:#46252f;border-color:#9d4358;color:#ff9cae}.cell.reserved{background:#342b4c;border-color:#67578f;color:#c5a9ff}.cell.maintenance,.cell.wall{background:#29313d;border-color:#4a5565;color:#8492a3}.cell.lane{background:repeating-linear-gradient(90deg,#141e2c,#141e2c 14px,#192638 14px,#192638 28px);color:#516177;border-style:dashed}.cell.entrance,.cell.exit{background:#133b39;border-color:#268376;color:#86f0db}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.legend span{font-size:11px;color:#aab7c9;display:flex;align-items:center;gap:6px}.swatch{width:8px;height:8px;border-radius:3px;background:var(--green)}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:13px;border:1px solid #233148;border-radius:10px;background:#0c1624}.stat .value{font-size:22px;font-weight:750}.stat .label{font-size:11px;color:#91a0b7}.pricebox{border-top:1px solid #243149;margin-top:16px;padding-top:15px}.line{display:flex;justify-content:space-between;margin:7px 0;color:#a9b7c9}.line.total{border-top:1px solid #293950;padding-top:12px;margin-top:12px;color:white;font-size:15px;font-weight:800}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.field label{font-size:11px;color:#aab8ca}.field input,.field select{background:#0a1422;border:1px solid #2b3a50;border-radius:8px;padding:10px 11px;color:white;outline:none;width:100%}.field input:focus,.field select:focus{border-color:#53dfa1}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#18372f;color:#82ecb4;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.06em}.pill.amber{background:#392f1c;color:#ffdc83}.pill.blue{background:#1b3047;color:#97cbff}.pill.red{background:#3d2029;color:#ff9cae}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #223047;font-size:12px}th{color:#8192aa;font-weight:600}td{color:#d1dae7}.empty{padding:30px;text-align:center;color:#91a0b7}.toast{position:fixed;right:22px;bottom:22px;background:#142338;border:1px solid #38506d;padding:12px 16px;border-radius:10px;z-index:30;box-shadow:0 10px 40px #0008;max-width:360px}.modalback{position:fixed;inset:0;background:#020711cc;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#111d2d;border:1px solid #30435e;border-radius:16px;padding:22px;box-shadow:0 25px 90px #000b}.modal h2{margin:0 0 6px}.qr{background:white;border-radius:10px;padding:12px;width:max-content;margin:14px auto}.foot{color:#6d7d93;font-size:11px;margin-top:20px}.mapeditor{display:grid;gap:5px}.editcell{height:40px;border-radius:6px;border:1px solid #30405a;background:#1b293c;color:#d9e5f3;font-size:10px}.kpis{grid-template-columns:repeat(4,1fr)}.twocol{grid-template-columns:1fr 1fr}.log{max-height:320px;overflow:auto}.logrow{padding:10px 0;border-bottom:1px solid #223047;font-size:12px}.mobiletabs{display:none}
    @media(max-width:900px){.columns{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{padding:0 15px}.top{height:64px}.right .online{display:none}.tabs{position:fixed;bottom:0;left:0;right:0;border-radius:0;justify-content:space-around;z-index:12;background:#0d1726f5;padding:7px max(5px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));border-top:1px solid #28374e}.tab{font-size:11px;padding:9px 8px}.view{padding-top:23px;padding-bottom:90px}.heading{align-items:flex-start;gap:12px;flex-direction:column}.heading h1{font-size:24px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:15px}.statrow{grid-template-columns:repeat(3,1fr)}.stat .value{font-size:18px}.right{font-size:12px}.kpis{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}}

<body><header class="top shell"><div class="brand"><div class="logo">P</div><div>ParkOS <span style="font-weight:400;color:#8192aa">/ SMART PARKING</span></div></div><nav class="tabs" id="tabs"><button class="tab active" data-view="driver">Driver Portal</button><button class="tab" data-view="gate">Gate Control</button><button class="tab" data-view="admin">Admin Center</button></nav><div class="right"><span class="online"><i class="dot"></i>All systems normal</span><span id="clock"></span></div></header><main class="shell" id="app"></main><div id="overlay"></div><script>
(()=>{'use strict';
const KEY='parkos-v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+(Math.round((Number(n)||0)*100)/100).toFixed(2);const now=()=>Date.now();const id=()=>`PK-${Math.random().toString(36).slice(2,6).toUpperCase()}${String(now()).slice(-4)}`;const clone=x=>JSON.parse(JSON.stringify(x));
const makeLayout=()=>{const rows=[];for(let r=0;r<6;r++){const row=[];for(let c=0;c<8;c++){let type;if(r===0&&c===0)type='entrance';else if(r===0&&c===7)type='exit';else if(c===0||c===7||r%2===0)type='lane';else type='slot';row.push({type,id:type==='slot'?`A-${r}${c}`:type==='entrance'?'IN':type==='exit'?'OUT':'',zone:r<3?'Zone A':'Zone B',tier:(c===6?'EV':c===5?'Premium':'Standard'),rate:c===6?5:c===5?4:3});}rows.push(row)}return rows};
const seed=()=>({layout:makeLayout(),bookings:[],events:[{at:now(),type:'SYSTEM',message:'ParkOS initialized. Demo data is stored on this device.'}],holds:{},pricing:{base:3,premium:4,ev:5,grace:10,overstay:1.5,peak:1.25},revenue:{entry:0,extension:0,exit:0},camera:{confidence:97,status:'Connected (simulated)'},view:'driver'});let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}let selected='',timer=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function log(type,message){state.events.unshift({at:now(),type,message});state.events=state.events.slice(0,250)}function occupied(slot){return state.bookings.find(b=>b.slot===slot&&['TEMP_HOLD','BOOKED','CHECKED_IN','EXTENDED','OVERSTAY','EXIT_PENDING_PAYMENT'].includes(b.status))}function slotState(cell){if(cell.type!=='slot')return cell.type;const hold=state.holds[cell.id];if(hold&&hold.until>now())return'hold';if(hold)delete state.holds[cell.id];const b=occupied(cell.id);if(b){if(['CHECKED_IN','EXTENDED','EXIT_PENDING_PAYMENT'].includes(b.status)&&now()>b.expires+state.pricing.grace*60000)return'overstay';return b.status==='BOOKED'?'booked':'occupied'}return cell.status||'available'}function getSlots(){return state.layout.flat().filter(c=>c.type==='slot')}function validateLayout(layout){const entrances=[],exits=[],slots=[];for(let r=0;r<layout.length;r++)for(let c=0;c<(layout[r]||[]).length;c++){const type=layout[r][c]?.type;if(type==='entrance')entrances.push([r,c]);if(type==='exit')exits.push([r,c]);if(type==='slot')slots.push([r,c])}const errors=[];if(!entrances.length)errors.push('Add an entrance.');if(!exits.length)errors.push('Add an exit.');if(!slots.length)errors.push('Add at least one parking bay.');if(entrances.length){const queue=[entrances[0]],seen=new Set([entrances[0].join(',')]);while(queue.length){const [r,c]=queue.shift();for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const rr=r+dr,cc=c+dc,cell=layout[rr]?.[cc],key=`${rr},${cc}`;if(cell&&['lane','entrance','exit'].includes(cell.type)&&!seen.has(key)){seen.add(key);queue.push([rr,cc])}}}if(exits.length&&!exits.some(([r,c])=>seen.has(`${r},${c}`)))errors.push('The exit is not connected to the entrance by lanes.');for(const [r,c] of slots)if(![[r+1,c],[r-1,c],[r,c+1],[r,c-1]].some(([rr,cc])=>seen.has(`${rr},${cc}`)))errors.push(`Bay ${layout[r][c].id||`${r+1}:${c+1}`} has no connected lane.`)}return errors}
function all(){return state.bookings.filter(b=>!['SETTLED_EXITED','CANCELLED','EXPIRED'].includes(b.status))}function fmtDuration(ms){let m=Math.max(0,Math.floor(ms/60000));return `${Math.floor(m/60)}h ${m%60}m`}function tariff(cell,hours){let rate=cell.rate||state.pricing.base;let day=new Date().getDay();let peak=(new Date().getHours()>=16&&new Date().getHours()<20)?state.pricing.peak:1;let wknd=(day===0||day===6)?1.1:1;let raw=Math.ceil(hours*2)/2*rate*peak*wknd;return{rate,peak,wknd,total:Math.round(raw*100)/100}}
function nav(view){state.view=view;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function render(){const app=$('#app');if(!app)return;app.innerHTML=state.view==='driver'?driver():state.view==='gate'?gate():admin();document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{selected=b.dataset.slot;render()});wire()}
function map(){return `<div class="mapwrap"><div class="lot" style="grid-template-columns:repeat(${state.layout[0]?.length||1},minmax(48px,1fr))">${state.layout.flatMap(row=>row).map(c=>{let st=slotState(c);let title=c.type==='slot'?`${c.id} · ${c.zone} · ${c.tier} · ${money(c.rate)}/hr · ${st}`:`${c.type}`;return `<button title="${esc(title)}" aria-label="${esc(title)}" class="cell ${esc(st)} ${c.type==='slot'?'slot':''}" ${c.type==='slot'?`data-slot="${esc(c.id)}"`:''}>${c.type==='slot'?esc(c.id):c.type==='entrance'?'ENTRY':c.type==='exit'?'EXIT':c.type==='lane'?'↔':'■'}</button>`}).join('')}</div></div><div class="legend">${[['available','#4ade80'],['hold','#fbbf24'],['booked','#60a5fa'],['occupied','#fb923c'],['overstay','#fb7185'],['reserved','#c4b5fd'],['maintenance','#8290a2']].map(([x,col])=>`<span><i class="swatch" style="background:${col}"></i>${x[0].toUpperCase()+x.slice(1)}</span>`).join('')}</div>`}
function driver(){let sel=getSlots().find(c=>c.id===selected);let status=sel&&slotState(sel);return `<section class="view"><div class="heading"><div><div class="eyebrow">PARKING, WITHOUT THE WAIT</div><h1>Find your space.</h1><div class="sub">Live availability · Zone A & B · Entrance at the northwest gate</div></div><div class="pill">● Live map</div></div><div class="grid columns"><div class="panel"><div class="panelhead"><div><h2>Lot map</h2><div class="muted">Select an available bay to see your estimate.</div></div><div class="muted">${getSlots().filter(c=>slotState(c)==='available').length} spaces open</div></div>${map()}</div><div class="panel"><div class="panelhead"><div><h2>${sel?`Reserve ${esc(selected)}`:'Your booking'}</h2><div class="muted">Choose a bay and parking duration.</div></div></div>${sel&&status==='available'?bookingForm(sel):sel?`<div class="empty">This space is ${esc(status)}. Pick an available bay.</div>`:`<div class="empty">Select an available bay on the map to get started.</div>`}<div class="pricebox"><h2 style="margin-bottom:10px">Your active passes</h2>${activePasses()}</div></div></div><div class="foot">Demo mode · payments, QR validation and occupancy sensors are simulated. Data stays in this browser.</div></section>`}
function bookingForm(cell){return `<form id="bookingForm" class="formgrid"><div class="field full"><label>Full name *</label><input name="name" required maxlength="80" autocomplete="name" placeholder="Alex Morgan"></div><div class="field"><label>Phone number *</label><input name="phone" required pattern="[+0-9() -]{7,20}" maxlength="20" autocomplete="tel" placeholder="+1 555 010 2020"></div><div class="field"><label>Vehicle plate (optional)</label><input name="plate" maxlength="12" placeholder="ABC 1234" style="text-transform:uppercase"></div><div class="field"><label>Duration</label><select name="hours"><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="1.5">1.5 hours</option><option value="2.25">2.25 hours</option><option value="2.5">2.5 hours</option><option value="4">4 hours</option><option value="8">8 hours</option></select></div><div class="field"><label>Bay rate</label><input value="${money(cell.rate)}/hr · ${esc(cell.tier)}" disabled></div><div id="estimate" class="full muted"></div><div class="actions full"><button class="btn primary" type="submit">Continue to payment · <span id="total"></span></button><button class="btn" type="button" id="clearSelect">Cancel</button></div></form>`}
function activePasses(){let bs=all().filter(b=>b.name);if(!bs.length)return'<div class="muted">No active bookings yet.</div>';return bs.map(b=>`<div style="padding:11px 0;border-bottom:1px solid #223047"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(b.slot)}</b><span class="pill ${b.status==='OVERSTAY'?'red':''}">${esc(b.status.replaceAll('_',' '))}</span></div><div class="muted">${esc(b.name)} · ${esc(b.plate||'No plate')} · ${esc(b.id)}</div><div class="actions" style="margin-top:8px"><button class="btn small" data-pass="${esc(b.id)}">View pass</button>${['CHECKED_IN','EXTENDED','OVERSTAY'].includes(b.status)?'<button class="btn small" data-extend="'+esc(b.id)+'">Extend</button>':''}<button class="btn small" data-export="${esc(b.id)}">Receipt</button></div></div>`).join('')}
function gate(){return `<section class="view"><div class="heading"><div><div class="eyebrow">OPERATIONS · GATE TERMINAL</div><h1>Gate Control</h1><div class="sub">Entry check-in, exit settlement and occupancy checks.</div></div><span class="pill">Barrier simulation ready</span></div><div class="grid twocol"><div class="panel"><div class="panelhead"><div><h2>Entry gate</h2><div class="muted">Scan a pass ID or match a vehicle plate.</div></div><span class="pill">ENTRY · ${state.bookings.filter(b=>b.status==='BOOKED').length} expected</span></div><form id="entryForm" class="actions"><input name="code" required placeholder="Booking ID or vehicle plate" class="field input" style="flex:1;min-width:180px;background:#0a1422;border:1px solid #2b3a50;border-radius:8px;padding:10px;color:white"><button class="btn primary">Verify & open</button></form><div id="entryResult" class="muted" style="margin-top:14px">Barrier closed · Awaiting scan</div></div><div class="panel"><div class="panelhead"><div><h2>Exit gate</h2><div class="muted">Settle any remaining balance to release the barrier.</div></div><span class="pill amber">EXIT · monitored</span></div><form id="exitForm" class="actions"><input name="code" required placeholder="Booking ID or vehicle plate" style="flex:1;min-width:180px;background:#0a1422;border:1px solid #2b3a50;border-radius:8px;padding:10px;color:white"><button class="btn primary">Calculate & settle</button></form><div id="exitResult" class="muted" style="margin-top:14px">Barrier closed · Awaiting scan</div></div><div class="panel"><div class="panelhead"><div><h2>Occupancy monitoring</h2><div class="muted">Simulated camera and sensor cross-check.</div></div><span class="pill">${state.camera.confidence}% confidence</span></div><div class="actions"><button class="btn" id="mismatch">Simulate mismatch</button><button class="btn" id="restoreCamera">Restore sensor status</button></div><div class="muted" style="margin-top:12px">${esc(state.camera.status)}</div></div><div class="panel"><h2>Gate events</h2><div class="log">${state.events.filter(e=>/GATE|PAYMENT|MISMATCH|BARRIER/.test(e.type)).slice(0,8).map(e=>`<div class="logrow"><span class="muted">${new Date(e.at).toLocaleTimeString()}</span> · ${esc(e.message)}</div>`).join('')||'<div class="muted" style="margin-top:12px">No gate events</div>'}</div></div></div></section>`}
function admin(){let slots=getSlots(),occ=slots.filter(s=>['occupied','overstay'].includes(slotState(s))).length,available=slots.filter(s=>slotState(s)==='available').length;let active=all();let avg=state.bookings.filter(b=>b.entry&&b.exit).reduce((a,b)=>a+b.exit-b.entry,0)/(state.bookings.filter(b=>b.entry&&b.exit).length||1);return `<section class="view"><div class="heading"><div><div class="eyebrow">PARKOS · OPERATIONS</div><h1>Command center</h1><div class="sub">Live lot status, sessions, revenue and system controls.</div></div><div class="actions"><button class="btn" id="exportLayout">Export layout</button><button class="btn" id="importLayoutBtn">Import layout</button><input type="file" id="importFile" accept="application/json" hidden></div></div><div class="grid kpis" style="margin-bottom:16px">${kpi('Total revenue',money(state.revenue.entry+state.revenue.extension+state.revenue.exit),'All payment stages')}${kpi('Occupancy',`${Math.round(occ/(slots.length||1)*100)}%`,`${occ} occupied · ${available} available`)}${kpi('Active sessions',active.length,`${active.filter(b=>b.status==='OVERSTAY').length} dwell alerts`)}${kpi('Average duration',fmtDuration(avg),'Settled sessions')}</div><div class="grid columns"><div class="panel"><div class="panelhead"><div><h2>Operator map</h2><div class="muted">Live lot layout and bay states</div></div></div>${map()}</div><div class="panel"><div class="panelhead"><div><h2>Layout builder</h2><div class="muted">Tap a cell to cycle its type; locked bays cannot change.</div></div></div>${layoutEditor()}<div class="actions" style="margin-top:13px"><button class="btn primary" id="publishLayout">Validate & publish</button><button class="btn" id="resetLayout">Reset demo layout</button></div><div class="foot">A valid layout needs an entrance, exit, and a connected lane route to every active bay.</div></div></div><div class="panel" style="margin-top:16px"><div class="panelhead"><div><h2>Live sessions</h2><div class="muted">Entry time, dwell and settlement status</div></div><span class="pill">${active.length} active</span></div>${ledger(active)}</div><div class="grid twocol" style="margin-top:16px"><div class="panel"><h2>Pricing & grace period</h2><div class="formgrid" style="margin-top:14px"><div class="field"><label>Standard rate / hr</label><input id="baseRate" type="number" min="0" step=".25" value="${state.pricing.base}"></div><div class="field"><label>Grace period (minutes)</label><input id="grace" type="number" min="0" max="120" value="${state.pricing.grace}"></div><div class="field"><label>Overstay multiplier</label><input id="overstayRate" type="number" min="1" step=".1" value="${state.pricing.overstay}"></div><div class="field"><label>Peak multiplier</label><input id="peakRate" type="number" min="1" step=".05" value="${state.pricing.peak}"></div></div><button class="btn" id="savePricing" style="margin-top:12px">Save tariff rules</button></div><div class="panel"><h2>Revenue breakdown</h2><div class="line"><span>Entry payments</span><b>${money(state.revenue.entry)}</b></div><div class="line"><span>Extensions</span><b>${money(state.revenue.extension)}</b></div><div class="line"><span>Exit settlements</span><b>${money(state.revenue.exit)}</b></div><div class="line total"><span>All time</span><b>${money(state.revenue.entry+state.revenue.extension+state.revenue.exit)}</b></div></div></div><div class="panel" style="margin-top:16px"><div class="panelhead"><div><h2>Audit trail</h2><div class="muted">Chronological record of system and operator activity</div></div><select id="eventFilter" style="background:#0a1422;border:1px solid #2b3a50;padding:7px;border-radius:7px;color:white"><option value="all">All events</option><option>BOOKING</option><option>PAYMENT</option><option>GATE</option><option>ADMIN</option><option>MISMATCH</option></select></div><div id="audit" class="log">${auditRows()}</div></div><div class="foot">This demo stores its data locally. Use browser storage controls to clear and restart the demo.</div></section>`}
function kpi(a,b,c){return`<div class="panel"><div class="muted">${a}</div><div style="font-size:23px;font-weight:800;margin:5px 0">${b}</div><div class="muted">${c}</div></div>`}
function layoutEditor(){let cells=state.layout.flat();let cols=state.layout[0]?.length||1;return `<div class="mapeditor" style="grid-template-columns:repeat(${cols},1fr)">${cells.map((c,i)=>{let locked=c.type==='slot'&&occupied(c.id);return `<button class="editcell ${locked?'booked':''}" data-edit="${i}" ${locked?'disabled title="Active booking locks this bay"':''}>${c.type==='slot'?esc(c.id):c.type==='entrance'?'IN':c.type==='exit'?'OUT':c.type==='lane'?'LANE':c.type==='wall'?'WALL':esc(c.type)}</button>`}).join('')}</div>`}
function ledger(active){if(!active.length)return'<div class="empty">No active sessions</div>';return `<div class="tablewrap"><table><thead><tr><th>Booking</th><th>Customer</th><th>Vehicle</th><th>Bay</th><th>Entry</th><th>Dwell</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead><tbody>${active.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.name)}<br><span class="muted">${esc(b.phone)}</span></td><td>${esc(b.plate||'—')}</td><td>${esc(b.slot)}</td><td>${b.entry?new Date(b.entry).toLocaleTimeString():'—'}</td><td>${b.entry?fmtDuration(now()-b.entry):'—'}</td><td>${new Date(b.expires).toLocaleTimeString()}</td><td><span class="pill ${b.status==='OVERSTAY'?'red':b.status==='BOOKED'?'blue':''}">${esc(b.status.replaceAll('_',' '))}</span></td><td><div class="actions">${b.status==='BOOKED'?`<button class="btn small" data-checkin="${esc(b.id)}">Check in</button>`:''}${b.status==='EXIT_PENDING_PAYMENT'?`<button class="btn small" data-settle="${esc(b.id)}">Force settle</button>`:''}<button class="btn small" data-dispute="${esc(b.id)}">Flag</button></div></td></tr>`).join('')}</tbody></table></div>`}
function auditRows(filter='all'){return state.events.filter(e=>filter==='all'||e.type.startsWith(filter)).map(e=>`<div class="logrow"><span class="muted">${new Date(e.at).toLocaleString()}</span> · <span class="pill ${e.type==='MISMATCH'?'red':''}">${esc(e.type)}</span> ${esc(e.message)}</div>`).join('')||'<div class="muted">No events match this filter.</div>'}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3200)}function modal(html){$('#overlay').innerHTML=`<div class="modalback" id="back"><div class="modal">${html}</div></div>`;$('#back').onclick=e=>{if(e.target.id==='back')$('#overlay').innerHTML=''}}
function wire(){let bf=$('#bookingForm');if(bf){const refresh=()=>{let c=getSlots().find(x=>x.id===selected),p=tariff(c,Number(bf.hours.value));$('#total').textContent=money(p.total);$('#estimate').textContent=`${bf.hours.value} hr × ${money(p.rate)}/hr${p.peak>1?' · peak tariff':''}${p.wknd>1?' · weekend tariff':''} · estimated entry payment ${money(p.total)}`};bf.hours.onchange=refresh;refresh();$('#clearSelect').onclick=()=>{selected='';render()};bf.onsubmit=e=>{e.preventDefault();if(!bf.reportValidity())return;let c=getSlots().find(x=>x.id===selected);if(!c||slotState(c)!=='available')return toast('That bay is no longer available.');let p=tariff(c,Number(bf.hours.value));state.holds[c.id]={until:now()+60000};let form=new FormData(bf);let b={id:id(),slot:c.id,name:form.get('name').trim(),phone:form.get('phone').trim(),plate:form.get('plate').trim().toUpperCase(),hours:Number(form.get('hours')),amount:p.total,status:'TEMP_HOLD',created:now(),expires:now()+Number(form.get('hours'))*3600000,entry:null,exit:null,extensions:0,tx:[]};state.bookings.push(b);log('BOOKING',`${b.id} placed a 60-second hold on ${b.slot}.`);save();paymentModal(b)}}
$('#entryForm')?.addEventListener('submit',async e=>{e.preventDefault();const raw=new FormData(e.target).get('code').trim();let pass=null;try{if(raw.startsWith('{'))pass=JSON.parse(raw)}catch{}const q=(pass?.id||raw).toUpperCase();let b=state.bookings.find(x=>x.id.toUpperCase()===q||x.plate&&x.plate.toUpperCase()===q);if(pass&&(!await verifyPass(pass)||pass.expires<now()))b=null;let box=$('#entryResult');if(!b||b.status!=='BOOKED'||now()>b.expires+state.pricing.grace*60000){box.innerHTML='<span style="color:#fb7185">Access denied · invalid, unpaid or expired booking.</span>';log('GATE',`Entry denied for ${q}.`);save();return}b.status='CHECKED_IN';b.entry=now();delete state.holds[b.slot];log('GATE',`Entry verified for ${b.id}; barrier opened.`);save();$('#entryResult').innerHTML=`<span style="color:#4ade80">✓ Entry approved · barrier open · ${esc(b.slot)} · ${esc(b.name)}</span>`});
$('#exitForm')?.addEventListener('submit',e=>{e.preventDefault();const q=new FormData(e.target).get('code').trim().toUpperCase();let b=state.bookings.find(x=>(x.id.toUpperCase()===q||x.plate&&x.plate.toUpperCase()===q)&&['CHECKED_IN','EXTENDED','OVERSTAY','EXIT_PENDING_PAYMENT'].includes(x.status));let box=$('#exitResult');if(!b){box.innerHTML='<span style="color:#fb7185">No active vehicle found.</span>';log('GATE',`Exit scan rejected for ${q}.`);save();return}const elapsed=(now()-b.entry)/3600000,allowed=(b.expires-b.entry)/3600000+state.pricing.grace/60,over=Math.max(0,elapsed-allowed),due=Math.round((over*b.amount/Math.max(b.hours,.1)*state.pricing.overstay+(b.deferredBalance||0))*100)/100;b.exitDue=due;if(due>0){b.status='EXIT_PENDING_PAYMENT';log('PAYMENT',`Exit balance ${money(due)} due for ${b.id}.`);save();box.innerHTML=`<span style="color:#fbbf24">Balance due ${money(due)} · dwell ${fmtDuration(now()-b.entry)} · grace ${state.pricing.grace} min</span> <button class="btn primary small" id="payExit">Pay & open barrier</button>`;$('#payExit').onclick=()=>{b.status='SETTLED_EXITED';b.exit=now();state.revenue.exit+=due;log('PAYMENT',`Exit settlement ${money(due)} paid for ${b.id}.`);log('GATE',`Exit verified for ${b.id}; barrier opened.`);box.innerHTML=`<span style="color:#4ade80">✓ Paid ${money(due)} · barrier open · receipt ready</span>`;save()}}else{b.status='SETTLED_EXITED';b.exit=now();log('GATE',`Exit approved for ${b.id}; no balance due, barrier opened.`);save();box.innerHTML='<span style="color:#4ade80">✓ No balance due · barrier open · session settled.</span>'}});
$('#mismatch')?.addEventListener('click',()=>{state.camera.confidence=42;state.camera.status='Low confidence · mismatch flagged';let b=all().find(x=>['CHECKED_IN','EXTENDED','OVERSTAY'].includes(x.status));if(b)b.status='DISPUTED';log('MISMATCH',b?`Camera occupancy mismatch flagged at ${b.slot} (${b.id}).`:'Unrecognized vehicle detected in a vacant bay.');save()});$('#restoreCamera')?.addEventListener('click',()=>{state.camera.confidence=97;state.camera.status='Connected (simulated)';all().filter(x=>x.status==='DISPUTED').forEach(x=>x.status='CHECKED_IN');log('ADMIN','Sensor status restored; disputes resolved.');save()});
document.querySelectorAll('[data-pass]').forEach(b=>b.onclick=()=>showPass(b.dataset.pass));document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportReceipt(b.dataset.export));document.querySelectorAll('[data-extend]').forEach(b=>b.onclick=()=>extendModal(b.dataset.extend));document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=()=>{let x=state.bookings.find(x=>x.id===b.dataset.checkin);if(x?.status==='BOOKED'){x.status='CHECKED_IN';x.entry=now();log('ADMIN',`Manual check-in for ${x.id}.`);save()}});document.querySelectorAll('[data-settle]').forEach(b=>b.onclick=()=>{let x=state.bookings.find(x=>x.id===b.dataset.settle);x.status='SETTLED_EXITED';x.exit=now();state.revenue.exit+=x.exitDue||0;log('ADMIN',`Force exit settlement for ${x.id}; ${money(x.exitDue||0)} recorded.`);save()});document.querySelectorAll('[data-dispute]').forEach(b=>b.onclick=()=>{let x=state.bookings.find(x=>x.id===b.dataset.dispute);x.status='DISPUTED';log('ADMIN',`Dispute flagged for ${x.id}.`);save()});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.edit),r=Math.floor(i/state.layout[0].length),c=i%state.layout[0].length,cell=state.layout[r][c],types=['slot','lane','wall','entrance','exit'];cell.type=types[(types.indexOf(cell.type)+1)%types.length];cell.id=cell.type==='slot'?`N-${r}${c}`:'';log('ADMIN',`Layout cell ${r+1}:${c+1} changed to ${cell.type}.`);save()});$('#publishLayout')?.addEventListener('click',()=>{let ent=state.layout.flat().some(c=>c.type==='entrance'),exit=state.layout.flat().some(c=>c.type==='exit'),slots=getSlots();const errors=validateLayout(state.layout);if(errors.length){toast('Publish blocked: '+errors[0]);return}if(slots.some(s=>occupied(s.id))){toast('Publish blocked: active bays lock the layout.');return}log('ADMIN','Layout validated and published.');save();toast('Layout published successfully.')});$('#resetLayout')?.addEventListener('click',()=>{if(all().length)return toast('Active sessions must finish before layout reset.');state.layout=makeLayout();log('ADMIN','Demo layout restored.');save()});$('#savePricing')?.addEventListener('click',()=>{state.pricing.base=Math.max(0,Number($('#baseRate').value)||0);state.pricing.grace=Math.max(0,Number($('#grace').value)||0);state.pricing.overstay=Math.max(1,Number($('#overstayRate').value)||1);state.pricing.peak=Math.max(1,Number($('#peakRate').value)||1);getSlots().forEach(c=>{if(c.tier==='Standard')c.rate=state.pricing.base});log('ADMIN','Tariff rules updated.');save();toast('Tariff rules saved.')});$('#eventFilter')?.addEventListener('change',e=>$('#audit').innerHTML=auditRows(e.target.value));$('#exportLayout')?.addEventListener('click',()=>download('parkos-layout.json',JSON.stringify({layout:state.layout,pricing:state.pricing},null,2),'application/json'));$('#importLayoutBtn')?.addEventListener('click',()=>$('#importFile').click());$('#importFile')?.addEventListener('change',async e=>{try{const data=JSON.parse(await e.target.files[0].text());const layout=data.layout||data;if(!Array.isArray(layout)||!layout.length||!layout.every(Array.isArray))throw Error();if(all().length)throw Error('Finish active sessions before importing.');if(!layout.flat().some(c=>c.type==='entrance')||!layout.flat().some(c=>c.type==='exit')||!layout.flat().some(c=>c.type==='slot'))throw Error('Layout needs entrance, exit and bays.');state.layout=layout;log('ADMIN','Layout imported from JSON.');save();toast('Layout imported. Check lanes before publishing.')}catch(err){toast(err.message==='Finish active sessions before importing.'?err.message:'Import failed: invalid layout JSON.')}e.target.value=''});
}
function paymentModal(b){let c=getSlots().find(x=>x.id===b.slot);modal(`<div class="eyebrow">SECURE CHECKOUT · STAGE 1</div><h2>Complete your booking</h2><div class="muted">Your bay is held for 60 seconds while you check out.</div><div class="pricebox"><div class="line"><span>Space · ${esc(b.slot)}</span><b>${esc(c.tier)}</b></div><div class="line"><span>${b.hours} hours · ${money(c.rate)}/hr</span><b>${money(b.amount)}</b></div><div class="line total"><span>Due now</span><b>${money(b.amount)}</b></div></div><div class="field" style="margin-top:15px"><label>Payment method</label><select id="payMethod"><option>UPI</option><option>Card</option><option>Wallet</option><option>Net Banking</option></select></div><div class="actions" style="margin-top:17px"><button class="btn primary" id="confirmPay" style="flex:1">Pay ${money(b.amount)}</button><button class="btn" id="cancelPay">Cancel</button></div><div class="foot">Payment is simulated. No payment details are collected.</div>`);$('#confirmPay').onclick=async()=>{if(!state.holds[b.slot]||state.holds[b.slot].until<now()){delete state.holds[b.slot];state.bookings=state.bookings.filter(x=>x.id!==b.id);$('#overlay').innerHTML='';save();return toast('Your hold expired. Please choose another bay.')}b.status='BOOKED';await signPass(b);b.method=$('#payMethod').value;b.tx.push({type:'ENTRY_PAYMENT',amount:b.amount,at:now(),id:'TX-'+id()});state.revenue.entry+=b.amount;delete state.holds[b.slot];log('PAYMENT',`Entry payment ${money(b.amount)} confirmed via ${b.method} for ${b.id}.`);log('BOOKING',`${b.id} confirmed; pass issued for ${b.slot}.`);selected='';$('#overlay').innerHTML='';save();showPass(b.id)};$('#cancelPay').onclick=()=>{delete state.holds[b.slot];state.bookings=state.bookings.filter(x=>x.id!==b.id);log('BOOKING',`${b.id} checkout cancelled; hold released.`);$('#overlay').innerHTML='';save()}}
const passSecret=(()=>{let s=localStorage.getItem('parkos-pass-secret');if(!s){const bytes=crypto.getRandomValues(new Uint8Array(32));s=[...bytes].map(x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('parkos-pass-secret',s)}return s})();const passPayload=b=>({id:b.id,slot:b.slot,entryWindow:b.created,plate:b.plate||'',expires:b.expires});async function signPass(b){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(passSecret),{name:'HMAC',hash:'SHA-256'},false,['sign']);const bytes=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(JSON.stringify(passPayload(b))));b.signature=[...new Uint8Array(bytes)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function verifyPass(p){const b=state.bookings.find(x=>x.id===p.id);if(!b||!b.signature||p.signature!==b.signature)return false;const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(passSecret),{name:'HMAC',hash:'SHA-256'},false,['verify']);const bytes=Uint8Array.from(b.signature.match(/.{2}/g)||[],x=>parseInt(x,16));return crypto.subtle.verify('HMAC',key,bytes,new TextEncoder().encode(JSON.stringify(passPayload(b))))}function token(b){return JSON.stringify({...passPayload(b),signature:b.signature||''})}function showPass(bookingId){let b=state.bookings.find(x=>x.id===bookingId);if(!b)return;modal(`<div class="eyebrow">PARKOS · DIGITAL PASS</div><h2>${esc(b.slot)} · ${esc(b.id)}</h2><div class="muted">Present this pass at the entry gate. Plate match is optional.</div><div class="qr" id="qr"></div><div class="statrow"><div class="stat"><div class="label">DRIVER</div><div class="value" style="font-size:14px">${esc(b.name)}</div></div><div class="stat"><div class="label">VEHICLE</div><div class="value" style="font-size:14px">${esc(b.plate||'—')}</div></div><div class="stat"><div class="label">EXPIRES</div><div class="value" style="font-size:14px">${new Date(b.expires).toLocaleTimeString()}</div></div></div><div style="text-align:center;margin:14px"><span class="pill blue">${esc(b.status.replaceAll('_',' '))}</span></div><div class="actions"><button class="btn primary" id="downloadPass">Download pass .txt</button><button class="btn" id="closeModal">Close</button></div><div class="foot">This demo pass is signed by this browser. Booking ID remains available for manual validation.</div>`);if(window.QRCode)new QRCode($('#qr'),{text:token(b),width:180,height:180});else $('#qr').textContent=b.id;$('#downloadPass').onclick=()=>exportReceipt(b.id);$('#closeModal').onclick=()=>$('#overlay').innerHTML=''}
function extendModal(bookingId){let b=state.bookings.find(x=>x.id===bookingId);if(!b)return;modal(`<div class="eyebrow">REMOTE EXTENSION</div><h2>Add parking time</h2><div class="muted">Extra time is added from your current expiry. Settlement can be paid now or at exit.</div><div class="field" style="margin-top:15px"><label>Extension</label><select id="extendTime"><option value="0.5">+30 minutes</option><option value="1">+1 hour</option><option value="1.5">+1.5 hours</option><option value="2">+2 hours</option></select></div><div class="line total"><span>Estimated due</span><b id="extendCost"></b></div><div class="actions"><button class="btn primary" id="payExtend">Pay now</button><button class="btn" id="deferExtend">Pay at exit</button><button class="btn" id="closeModal">Cancel</button></div>`);const cost=()=>{let v=Number($('#extendTime').value);$('#extendCost').textContent=money(v*b.amount/b.hours)};$('#extendTime').onchange=cost;cost();['payExtend','deferExtend'].forEach((idn,i)=>$('#'+idn).onclick=()=>{let hrs=Number($('#extendTime').value),amount=Math.round(hrs*b.amount/b.hours*100)/100;b.expires+=hrs*3600000;b.extensions+=hrs;b.status='EXTENDED';if(i===0){state.revenue.extension+=amount;b.tx.push({type:'EXTENSION',amount,at:now(),id:'TX-'+id()});log('PAYMENT',`Extension ${money(amount)} paid for ${b.id}.`)}else{b.deferredBalance=(b.deferredBalance||0)+amount;log('BOOKING',`${b.id} extended ${hrs}h; ${money(amount)} deferred to exit.`)}log('BOOKING',`${b.id} expiry extended by ${hrs}h.`);$('#overlay').innerHTML='';save();toast('Parking time extended.')});$('#closeModal').onclick=()=>$('#overlay').innerHTML=''}
function exportReceipt(bookingId){let b=state.bookings.find(x=>x.id===bookingId);if(!b)return;download(`${b.id}-receipt.txt`,`PARKOS PARKING RECEIPT\nBooking: ${b.id}\nDriver: ${b.name}\nPhone: ${b.phone}\nVehicle: ${b.plate||'Not provided'}\nSpace: ${b.slot}\nStatus: ${b.status}\nEntry payment: ${money(b.amount)}\nEntry time: ${b.entry?new Date(b.entry).toLocaleString():'Not checked in'}\nExpiry: ${new Date(b.expires).toLocaleString()}\nExit: ${b.exit?new Date(b.exit).toLocaleString():'Pending'}\nExit settlement: ${money(b.exitDue||0)}\nGenerated: ${new Date().toLocaleString()}\n`, 'text/plain')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});if(state.view==='driver'||state.view==='admin')render();for(let b of state.bookings){if(b.status==='TEMP_HOLD'&&(!state.holds[b.slot]||state.holds[b.slot].until<now())){b.status='EXPIRED';delete state.holds[b.slot];log('BOOKING',`${b.id} checkout hold expired.`)}if(b.status==='BOOKED'&&now()>b.expires+state.pricing.grace*60000){b.status='EXPIRED';log('BOOKING',`${b.id} expired before entry.`)}if(b.entry&&['CHECKED_IN','EXTENDED'].includes(b.status)&&now()>b.expires+state.pricing.grace*60000)b.status='OVERSTAY';if(b.entry&&b.status==='CHECKED_IN'&&!b.reminded&&b.expires-now()<15*60000&&b.expires>now()){b.reminded=true;log('BOOKING',`15-minute expiry reminder sent for ${b.id}.`);if('Notification'in window&&Notification.permission==='granted')new Notification('Parking expires soon',{body:`Your ${b.slot} session expires in 15 minutes.`})}}save()},30000);
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('/sw.js').catch(()=>{});render();
})();
